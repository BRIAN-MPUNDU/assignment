$kind: http-request
description: "Expected: 200 OK and updated fields in data."
url: "{{baseUrl}}/api/notices/{{createdId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "event_title": "Postman API Testing Workshop - Updated",
      "category": "Academic",
      "description": "Updated description after testing the PUT endpoint.",
      "venue": "Computer Lab 3",
      "event_date": "2026-11-21",
      "organizer": "ICT251 Project Team",
      "status": "Ongoing"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Title was updated', () => pm.expect(pm.response.json().data.event_title).to.include('Updated')); 
    language: text/javascript
order: 4000
